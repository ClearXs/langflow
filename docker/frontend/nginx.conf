server {
    # Gzip 配置（不压缩流式响应）
    gzip off;
    gzip_comp_level  2;
    gzip_min_length  1000;
    gzip_types  text/xml text/css text/javascript application/javascript;
    gzip_http_version 1.1;
    gzip_vary  on;
    gzip_disable "MSIE [4-6] \.";
    gzip_proxied no-cache no-store private expired auth;

    # 全局超时配置
    keepalive_timeout 3600s;
    keepalive_requests 1000;
    send_timeout 3600s;

    # 客户端超时配置
    client_body_timeout 3600s;
    client_header_timeout 3600s;

    listen __FRONTEND_PORT__;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
        expires 1d;
        add_header Cache-Control "public";
    }
    location /api {
        # 超时配置
        proxy_read_timeout 3600s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 3600s;

        # 流式传输核心配置
        proxy_buffering off;                    # 禁用缓冲，立即传输数据
        proxy_request_buffering off;            # 禁用请求缓冲
        proxy_http_version 1.1;                 # 使用 HTTP/1.1 支持 chunked encoding
        proxy_set_header Connection "";         # 移除 Connection 头，让后端控制
        chunked_transfer_encoding on;           # 明确启用 chunked 传输

        # 缓存配置
        proxy_cache off;                        # 禁用缓存
        proxy_cache_bypass $http_upgrade;       # 绕过缓存
        proxy_no_cache 1;                       # 不缓存响应

        # 缓冲区配置 - 设置为最小值以支持流式传输
        proxy_buffer_size 4k;                   # 减小缓冲区大小
        proxy_buffers 8 4k;                     # 减小缓冲区数量和大小
        proxy_busy_buffers_size 8k;             # 减小忙碌缓冲区大小

        # 请求头配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 和 WebSocket 支持
        proxy_set_header X-Accel-Buffering no;  # 完全禁用加速缓冲
        proxy_set_header Cache-Control "no-cache, no-store, must-revalidate";

        # 保持连接活跃
        proxy_socket_keepalive on;

        proxy_pass __BACKEND_URL__;
    }
    location /health_check {
        proxy_pass __BACKEND_URL__;
    }
    location /health {
        proxy_pass __BACKEND_URL__;
    }
    location /data-api {
        proxy_pass __DATA_API_URL__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}
