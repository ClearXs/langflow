server {
    # Gzip 配置（不压缩流式响应）
    gzip on;
    gzip_comp_level  2;
    gzip_min_length  1000;
    gzip_types  text/xml text/css text/javascript application/javascript;
    gzip_http_version 1.1;
    gzip_vary  on;
    gzip_disable "MSIE [4-6] \.";
    gzip_proxied no-cache no-store private expired auth;

    listen __FRONTEND_PORT__;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
        expires 1d;
        add_header Cache-Control "public";
    }
    location /api {
        # 超时配置
        proxy_read_timeout 3600s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;

        proxy_buffering off;              # 禁用缓冲，立即传输数据
        proxy_http_version 1.1;           # 使用 HTTP/1.1 支持 chunked encoding
        proxy_set_header Connection "";   # 移除 Connection 头，让后端控制
        proxy_cache off;                  # 禁用缓存
        proxy_cache_bypass $http_upgrade; # 绕过缓存

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ✅ 支持 Server-Sent Events (SSE) 和 WebSocket
        proxy_set_header X-Accel-Buffering no;  # 完全禁用缓冲

        proxy_pass __BACKEND_URL__;
    }
    location /health_check {
        proxy_pass __BACKEND_URL__;
    }
    location /health {
        proxy_pass __BACKEND_URL__;
    }
    location /data-api {
        proxy_pass __DATA_API_URL__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}
